<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order QR Generator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --page-bg: #ebebeb;
      --card-bg: #fff;
      --border: #e4e4e7;
      --text: #111;
      --muted: #6b7280;
      --blue: #1a73e8;
      --red: #e53935;
      --orange: #f57c00;
      --green: #16a34a;
      --radius: 16px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--page-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0;
      gap: 0;
    }

    /* ── Navbar ── */
    .navbar {
      width: 100%;
      background: #fff;
      border-bottom: 1px solid #e9e9e9;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .navbar img {
      height: 32px;
      width: auto;
      display: block;
    }

    /* ── Page content wrapper ── */
    .page-content {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px 48px;
      gap: 20px;
      flex: 1;
    }

    /* ── Footer ── */
    .footer {
      width: 100%;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 24px 16px;
      margin-top: auto;
    }

    .footer img {
      height: 24px;
      width: auto;
      opacity: 0.85;
      filter: brightness(0) invert(1);
    }

    .footer p {
      font-size: 11.5px;
      color: #6b7280;
      text-align: center;
    }

    @media (max-width: 480px) {
      .page-content { padding: 16px 12px 40px; gap: 14px; }

      .form-card { padding: 18px 16px; border-radius: 14px; }
      .form-card h1 { font-size: 14.5px; }
      .tagline { font-size: 12px; }

      .hb-card { border-radius: 16px; }
      .hb-header { padding: 16px 16px 13px; }
      .hb-header h2 { font-size: 15.5px; }
      .hb-header p { font-size: 12.5px; }

      .hb-qr { padding: 24px 16px 20px; gap: 14px; }
      .hb-qr canvas { width: 160px !important; height: 160px !important; }
      .hb-pin { font-size: 15px; }

      .btn-download { font-size: 14px; padding: 12px; }
    }

    @media (max-width: 360px) {
      body { padding: 12px 10px 32px; }
      .hb-qr canvas { width: 140px !important; height: 140px !important; }
    }

    /* ── Form card ── */
    .form-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 22px 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07), 0 6px 20px rgba(0,0,0,0.06);
    }

    .form-card h1 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
      letter-spacing: -0.1px;
    }

    .tagline {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group.full { grid-column: span 2; }

    label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.1px;
    }

    input {
      padding: 9px 11px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
      background: #fff;
      width: 100%;
    }

    input:focus { border-color: var(--blue); }
    input::placeholder { color: #a1a1aa; }

    /* Prevent iOS zoom on focus */
    @media (max-width: 480px) {
      input { font-size: 16px; }
    }

    .pin-hint {
      font-size: 11px;
      color: #f59e0b;
      min-height: 14px;
    }
    .pin-hint.ok { color: var(--green); }

    /* ── HungerBox preview card ── */
    .preview-label {
      width: 100%;
      max-width: 420px;
      font-size: 10.5px;
      font-weight: 700;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      padding-left: 2px;
    }

    .hb-card {
      background: #fff;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.14);
    }

    /* Header */
    .hb-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 20px 20px 16px;
      gap: 12px;
    }

    .hb-header h2 {
      font-size: 17px;
      font-weight: 700;
      color: #111;
      margin-bottom: 4px;
      line-height: 1.2;
    }

    .hb-header p {
      font-size: 13px;
      color: #6b7280;
    }

    .hb-x {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      background: var(--red);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
    }

    /* Divider */
    .hb-divider { height: 1px; background: #e5e7eb; }

    /* QR section */
    .hb-qr {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 20px 24px;
      gap: 18px;
      background: #fff;
    }

    .hb-qr canvas {
      display: block;
      image-rendering: pixelated;
    }

    .hb-pin {
      font-size: 17px;
      color: #111;
      text-align: center;
      letter-spacing: 0.1px;
    }

    .hb-pin strong {
      font-weight: 700;
    }

    /* Empty QR placeholder */
    .hb-qr-placeholder {
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ebebeb;
      border-radius: 8px;
    }

    /* Meta section */
    .hb-meta {
      padding: 16px 20px 4px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .hb-ref-block strong {
      display: block;
      font-size: 13.5px;
      font-weight: 700;
      color: #111;
      margin-bottom: 3px;
    }

    .hb-ref-block span {
      font-size: 12px;
      color: #6b7280;
    }

    .hb-kot-block {
      text-align: right;
    }

    .hb-kot-block .kot-label {
      font-size: 11px;
      color: #6b7280;
      display: block;
      margin-bottom: 2px;
    }

    .hb-kot-block .kot-num {
      font-size: 34px;
      font-weight: 700;
      color: var(--blue);
      display: block;
      line-height: 1;
    }

    /* Items ready */
    .hb-items {
      padding: 10px 20px 18px;
      font-size: 14px;
      color: #111;
    }

    /* Footer */
    .hb-footer {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 20px;
      border-top: 1px solid #e5e7eb;
    }

    .hb-footer-icon {
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, #ff7043, #f57c00);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .hb-footer span {
      font-size: 14px;
      font-weight: 500;
      color: #111;
    }

    /* Empty state inside card */
    .hb-empty {
      padding: 48px 20px;
      text-align: center;
      color: #a1a1aa;
    }

    .hb-empty svg { margin-bottom: 12px; opacity: 0.35; }
    .hb-empty p { font-size: 13px; line-height: 1.5; }

    /* Actions */
    .actions {
      width: 100%;
      max-width: 420px;
    }

    .btn-download {
      width: 100%;
      padding: 13px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, transform 0.1s, opacity 0.15s;
    }

    .btn-download:hover:not(:disabled) { background: #222; }
    .btn-download:active:not(:disabled) { transform: scale(0.985); }
    .btn-download:disabled { opacity: 0.35; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <img src="logo.svg" alt="HungerBox" />
  </nav>

  <div class="page-content">

  <!-- Form -->
  <div class="form-card">
    <h1>Order QR Generator</h1>
    <p class="tagline">No more struggling to capture or share QR screenshots — just share the PIN and generate it instantly here.</p>
    <div class="form-grid">

      <div class="form-group full">
        <label>Order PIN</label>
        <input id="pin" type="text" inputmode="numeric" placeholder="6-digit PIN" maxlength="6" autocomplete="off" />
        <div class="pin-hint" id="pin-hint"></div>
      </div>

    </div>
  </div>

  <!-- Preview label -->
  <div class="preview-label">Preview</div>

  <!-- HungerBox-style card -->
  <div class="hb-card" id="hb-card">
    <div class="hb-empty">
      <svg width="52" height="52" viewBox="0 0 52 52" fill="none">
        <rect x="4" y="4" width="18" height="18" rx="2.5" stroke="#9ca3af" stroke-width="2"/>
        <rect x="9" y="9" width="8" height="8" rx="1" fill="#9ca3af"/>
        <rect x="30" y="4" width="18" height="18" rx="2.5" stroke="#9ca3af" stroke-width="2"/>
        <rect x="35" y="9" width="8" height="8" rx="1" fill="#9ca3af"/>
        <rect x="4" y="30" width="18" height="18" rx="2.5" stroke="#9ca3af" stroke-width="2"/>
        <rect x="9" y="35" width="8" height="8" rx="1" fill="#9ca3af"/>
        <rect x="30" y="30" width="5" height="5" rx="0.5" fill="#9ca3af"/>
        <rect x="39" y="30" width="5" height="5" rx="0.5" fill="#9ca3af"/>
        <rect x="30" y="39" width="5" height="5" rx="0.5" fill="#9ca3af"/>
        <rect x="39" y="39" width="5" height="5" rx="0.5" fill="#9ca3af"/>
        <rect x="34.5" y="34.5" width="5" height="5" rx="0.5" fill="#9ca3af"/>
      </svg>
      <p>Enter a 6-digit PIN to<br>preview the collection card</p>
    </div>
  </div>

  <!-- Download -->
  <div class="actions">
    <button class="btn-download" id="dl-btn" disabled>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M8 2v8m0 0L5 7m3 3 3-3M2 13h12" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Download as PNG
    </button>
  </div>

  </div><!-- /page-content -->

  <script src="qrcode.min.js"></script>
  <script>
    const pinEl   = document.getElementById('pin');
    const hint    = document.getElementById('pin-hint');
    const card    = document.getElementById('hb-card');
    const dlBtn   = document.getElementById('dl-btn');

    let activeQRCanvas = null;
    let genTime = '';
    let debounce;

    function fmt12h() {
      const d = new Date();
      let h = d.getHours(), m = d.getMinutes();
      const ap = h >= 12 ? 'pm' : 'am';
      h = h % 12 || 12;
      return `${h}:${String(m).padStart(2,'0')} ${ap}`;
    }

    function buildQRCanvas(text) {
      const qr = qrcode(0, 'M');
      qr.addData(text);
      qr.make();
      const mods = qr.getModuleCount();
      const cell = 8, margin = 4;
      const dim  = (mods + margin * 2) * cell;
      const c    = document.createElement('canvas');
      c.width = c.height = dim;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, dim, dim);
      ctx.fillStyle = '#000';
      for (let r = 0; r < mods; r++)
        for (let col = 0; col < mods; col++)
          if (qr.isDark(r, col))
            ctx.fillRect((col+margin)*cell, (r+margin)*cell, cell, cell);
      return c;
    }

    function refresh() {
      const pin = pinEl.value.replace(/\D/g,'').slice(0,6);

      if (pin.length < 6) {
        hint.className = 'pin-hint';
        hint.textContent = pin.length
          ? `${pin.length} / 6 — ${6 - pin.length} more digit${6-pin.length===1?'':'s'} needed`
          : '';
        showEmpty();
        return;
      }

      hint.className = 'pin-hint ok';
      hint.textContent = '✓ Valid PIN';
      activeQRCanvas = buildQRCanvas(pin);
      showCard(pin);
    }

    function showEmpty() {
      activeQRCanvas = null;
      dlBtn.disabled = true;
      card.innerHTML = `
        <div class="hb-empty">
          <svg width="52" height="52" viewBox="0 0 52 52" fill="none">
            <rect x="4" y="4" width="18" height="18" rx="2.5" stroke="#9ca3af" stroke-width="2"/>
            <rect x="9" y="9" width="8" height="8" rx="1" fill="#9ca3af"/>
            <rect x="30" y="4" width="18" height="18" rx="2.5" stroke="#9ca3af" stroke-width="2"/>
            <rect x="35" y="9" width="8" height="8" rx="1" fill="#9ca3af"/>
            <rect x="4" y="30" width="18" height="18" rx="2.5" stroke="#9ca3af" stroke-width="2"/>
            <rect x="9" y="35" width="8" height="8" rx="1" fill="#9ca3af"/>
            <rect x="30" y="30" width="5" height="5" rx="0.5" fill="#9ca3af"/>
            <rect x="39" y="30" width="5" height="5" rx="0.5" fill="#9ca3af"/>
            <rect x="30" y="39" width="5" height="5" rx="0.5" fill="#9ca3af"/>
            <rect x="39" y="39" width="5" height="5" rx="0.5" fill="#9ca3af"/>
            <rect x="34.5" y="34.5" width="5" height="5" rx="0.5" fill="#9ca3af"/>
          </svg>
          <p>Enter a 6-digit PIN to<br>preview the collection card</p>
        </div>`;
    }

    function showCard(pin) {
      // Resize QR canvas for display
      activeQRCanvas.style.width  = '180px';
      activeQRCanvas.style.height = '180px';

      card.innerHTML = '';

      // Header
      card.insertAdjacentHTML('beforeend', `
        <div class="hb-header">
          <div>
            <h2>To collect, scan QR code</h2>
            <p>This QR can be used to collect all items.</p>
          </div>
          <div class="hb-x">
            <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
              <path d="M1 1l9 9M10 1L1 10" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
        <div class="hb-divider"></div>
      `);

      // QR section
      const qrWrap = document.createElement('div');
      qrWrap.className = 'hb-qr';
      qrWrap.appendChild(activeQRCanvas);
      qrWrap.insertAdjacentHTML('beforeend',
        `<div class="hb-pin">Order Pin: <strong>${pin}</strong></div>`);
      card.appendChild(qrWrap);


      dlBtn.disabled = false;
    }

    // ── Download as PNG ──────────────────────────────────────────────────────
    dlBtn.addEventListener('click', () => {
      if (!activeQRCanvas) return;

      const pin = pinEl.value.replace(/\D/g,'').slice(0,6);

      const S = 2; // retina scale
      const W = 390;

      // Heights of each section
      const H_HEAD  = 84;
      const H_DIV   = 1;
      const QR_SZ   = 200;
      const H_QR    = 32 + QR_SZ + 18 + 28 + 24; // top + qr + gap + pin + bot
      const H_TOTAL = H_HEAD + H_DIV + H_QR;

      const c   = document.createElement('canvas');
      c.width   = W * S;
      c.height  = H_TOTAL * S;
      const ctx = c.getContext('2d');
      ctx.scale(S, S);

      const FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif';

      // White background
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, W, H_TOTAL);

      let y = 0;

      // ── Header ──
      ctx.fillStyle = '#111';
      ctx.font = `bold 17px ${FONT}`;
      ctx.textAlign = 'left';
      ctx.fillText('To collect, scan QR code', 20, y + 33);

      ctx.fillStyle = '#6b7280';
      ctx.font = `13px ${FONT}`;
      ctx.fillText('This QR can be used to collect all items.', 20, y + 55);

      // Red X circle
      ctx.beginPath();
      ctx.arc(W - 33, y + 27, 13, 0, Math.PI * 2);
      ctx.fillStyle = '#e53935';
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(W-39, y+21); ctx.lineTo(W-27, y+33); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(W-27, y+21); ctx.lineTo(W-39, y+33); ctx.stroke();

      y += H_HEAD;

      // ── Divider ──
      ctx.fillStyle = '#e5e7eb';
      ctx.fillRect(0, y, W, 1);
      y += H_DIV;

      // ── QR section (gray bg) ──
      ctx.fillStyle = '#f9f9f9';
      ctx.fillRect(0, y, W, H_QR);

      const qrX = (W - QR_SZ) / 2;
      const qrY = y + 28;
      ctx.drawImage(activeQRCanvas, qrX, qrY, QR_SZ, QR_SZ);

      // "Order Pin: XXXXXX"
      const pinLabel = 'Order Pin: ';
      ctx.font = `15px ${FONT}`;
      ctx.fillStyle = '#111';
      ctx.textAlign = 'center';
      const labelW = ctx.measureText(pinLabel).width;
      ctx.font = `bold 15px ${FONT}`;
      const pinW = ctx.measureText(pin).width;
      const totalW = labelW + pinW;
      const startX = (W - totalW) / 2;
      const pinTextY = qrY + QR_SZ + 24;
      ctx.font = `15px ${FONT}`;
      ctx.textAlign = 'left';
      ctx.fillText(pinLabel, startX, pinTextY);
      ctx.font = `bold 15px ${FONT}`;
      ctx.fillText(pin, startX + labelW, pinTextY);

      y += H_QR;


      // Save
      const link = document.createElement('a');
      link.download = `order-qr-${pin}.png`;
      link.href = c.toDataURL('image/png');
      link.click();
    });

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    // ── Event listeners ──────────────────────────────────────────────────────
    pinEl.addEventListener('input', () => {
      const d = pinEl.value.replace(/\D/g,'').slice(0,6);
      if (pinEl.value !== d) pinEl.value = d;
      clearTimeout(debounce);
      debounce = setTimeout(refresh, 120);
    });

  </script>
</body>
</html>
